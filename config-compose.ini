# 以下为必填项
# 飞书自建应用凭证 (开发者后台 -> 凭证与基础信息)
APP_ID = cli_xxxxxxxxxxxxxxxxx
APP_SECRET = YOUR_APP_SECRET

# 你的网易云 cookie 中 MUSIC_U 项的值（用于下载无损歌曲）
MUSIC_U = YOUR_MUSIC_U


# 以下为可选项
# 设置 bot 管理员 open_id, 用 "," 分隔
BotAdmin = ou_xxxxxxxx,ou_yyyyyyyy

# 是否开启 bot 的 debug 日志
BotDebug = false

# 自定义 sqlite3 数据库文件 （默认为 cache.db）
Database = cache.db

# 设置日志等级 [panic|fatal|error|warn|info|debug|trace] (默认为 info)
LogLevel = info

# 最大自动重试次数 (默认为 3)
MaxRetryTimes = 3

# 下载超时时长 (单位秒, 默认为 60)
DownloadTimeout = 60

# 自定义下载反向代理
# ReverseProxy = 114.5.1.4:8080

# 语音方式的 opus 转码参数 (默认 128k / 48000 / 2)
# 若你的飞书客户端无法播放, 尝试改为官方示例参数 16k / 16000 / 1
# OpusBitrate = 128k
# OpusSampleRate = 48000
# OpusChannels = 2
